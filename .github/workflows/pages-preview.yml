name: GitHub Pages — Portfolio preview

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.pdf'
      - '**/*.mp4'
      - '**/*.jpg'
      - '**/*.png'
      - '**/*.vtt'
      - '**/*.txt'
      - 'scripts/build_pages_preview.py'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current website
        uses: actions/checkout@v4
      - name: Build GitHub Pages preview and verify links
        run: python3 scripts/build_pages_preview.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload preview files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy portfolio preview
        id: deployment
        uses: actions/deploy-pages@v4
