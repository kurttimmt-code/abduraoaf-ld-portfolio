name: Import verified portfolio website files
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-site.yml'
permissions:
  contents: write
jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download published files and verify SHA-256
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request, urllib.parse
          manifest = """Abduraoaf_Sandan_LD_Portfolio_Draft.pdf 8b82c21c34b0fea6c58cb85db458c4b02265fc63b39e8101726579aec07ec3f7
