tfg.html adb780e81ce44eb1def2ddf54d0224d91838daabd2977a782b3b6f8d57c6cb90"""
          files = [line.split() for line in manifest.splitlines() if line.strip()]
          base = "https://abduraoafsandan.netlify.app/"
          for path, expected in files:
              url = base + urllib.parse.quote(path, safe="/")
              req = urllib.request.Request(url, headers={"User-Agent": "Abduraoaf-Portfolio-GitHub-Sync/1.0"})
              with urllib.request.urlopen(req, timeout=35) as response:
                  payload = response.read()
              actual = hashlib.sha256(payload).hexdigest()
              if actual != expected:
                  raise RuntimeError(f"Checksum mismatch for {path}: {actual} != {expected}; refusing to commit unexpected content")
              destination = pathlib.Path(path)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(payload)
              print(f"verified {path} ({len(payload)} bytes)")
          print(f"Verified {len(files)} portfolio files")
          PY
      - name: Commit verified portfolio source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'No file changes to commit'
          else
            git commit -m 'Import verified static portfolio source and media'
            git push
          fi
